<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>

    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-end">
            <div class="navbar-item">
                <a class="button is-primary" href="../index.html">
                    <strong>Home</strong>
                </a>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">

            <h1 class="title has-text-centered">PEDIDOS</h1>
            <hr>

            <div class="box">

                <form id="formPedido">

                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input
                                class="input"
                                type="text"
                                id="cliente"
                                placeholder="Ingrese su nombre"
                                required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Teléfono</label>
                        <div class="control">
                            <input
                                class="input"
                                type="tel"
                                id="telefono"
                                placeholder="Ingrese su teléfono"
                                required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Producto</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="producto" required>
                                    <option value="">Seleccione un producto</option>
                                    <option value="Churros">Churros</option>
                                    <option value="Quesillo">Quesillo</option>
                                    <option value="Torta Tres Leches">Torta Tres Leches</option>
                                    <option value="Marquesa de Chocolate">Marquesa de Chocolate</option>
                                    <option value="Torta de Chocolate">Torta de Chocolate</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Cantidad</label>
                        <div class="control">
                            <input
                                class="input"
                                type="number"
                                id="cantidad"
                                min="1"
                                placeholder="Ingrese la cantidad"
                                required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Dirección de Entrega</label>
                        <div class="control">
                            <textarea
                                class="textarea"
                                id="direccion"
                                placeholder="Ingrese la dirección"
                                required></textarea>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Método de Pago</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="metodo_pago" required>
                                    <option value="">Seleccione una opción</option>
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                                    <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                                    <option value="Nequi">Nequi</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field has-text-centered">
                        <button class="button is-primary" type="submit" id="btnRegistrar">
                            Registrar Pedido
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/pedidos.js"></script>

</body>

</html>
