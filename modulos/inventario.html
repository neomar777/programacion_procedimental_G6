<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Producto</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>
<body>

<nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item">
            <p class="title is-3 is-spaced">Inventario</p>
        </a>
    </div>

    <div class="navbar-end">
        <div class="navbar-item">
            <div class="buttons">
                <a class="button is-primary" href="../index.html">
                    <strong>Home</strong>
                </a>
            </div>
        </div>
    </div>
</nav>

<section class="section">
    <div class="container">

        <div class="columns is-centered">
            <div class="column is-6">

                <div class="box">

                    <h1 class="title has-text-centered">
                        Registro de Productos
                    </h1>

                    <div class="field">
                        <label class="label">Código Producto</label>
                        <div class="control">
                            <input
                                class="input"
                                type="text"
                                id="codigo_producto"
                                placeholder="Ingrese el código">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Nombre Producto</label>
                        <div class="control">
                            <input
                                class="input"
                                type="text"
                                id="nombre_producto"
                                placeholder="Ingrese el nombre">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Precio Unidad</label>
                        <div class="control">
                            <input
                                class="input"
                                type="number"
                                step="0.01"
                                id="precio_unidad"
                                placeholder="Ingrese el precio">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Cantidad Producto</label>
                        <div class="control">
                            <input
                                class="input"
                                type="number"
                                id="cantidad_producto"
                                placeholder="Ingrese la cantidad">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Marca Producto</label>
                        <div class="control">
                            <input
                                class="input"
                                type="text"
                                id="marca_producto"
                                placeholder="Ingrese la marca">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Categoría Producto</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="categoria_producto">
                                    <option value="">Seleccione una categoría</option>
                                    <option value="Alimentos">Alimentos</option>
                                    <option value="Bebidas">Bebidas</option>
                                    <option value="Limpieza">Limpieza</option>
                                    <option value="Tecnologia">Tecnología</option>
                                    <option value="Otros">Otros</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Unidad de Medida</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="unidad_medida">
                                    <option value="">Seleccione una unidad</option>
                                    <option value="Unidad">Unidad</option>
                                    <option value="Kilogramo">Kilogramo</option>
                                    <option value="Litro">Litro</option>
                                    <option value="Caja">Caja</option>
                                    <option value="Paquete">Paquete</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field mt-5">
                        <div class="control">
                            <button class="button is-primary is-fullwidth" id="btnGuardar">
                                Guardar Producto
                            </button>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/inventario.js"></script>

</body>
</html>
